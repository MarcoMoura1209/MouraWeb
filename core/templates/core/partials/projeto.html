
    <div class="projeto" role="article" aria-label="Projeto: {{ projeto.titulo }}">
        <div class="projeto-imagem">
            <img src="{{ projeto.imagem.url }}" alt="Captura de tela do projeto {{ projeto.titulo }}">
        </div>
        <div class="projeto-conteudo">
            <h3 class="titulo-muito-pequeno projeto-titulo">
                {{ projeto.titulo }}
            </h3>
        
            <p class="projeto-descricao">
                {{ projeto.descricao }}
            </p>
        </div>
        <div class="projeto-tecnologias" role="group" aria-label="Tecnologias utilizadas em {{ projeto.titulo }}">
            {% for tecnologia in projeto.tecnologias.all %}
        
                <span class="badge" aria-label="Tecnologia: {{ tecnologia.nome }}">
                    {{ tecnologia.nome }}
                </span>
        
            {% endfor %}
        </div>
        <div class="projeto-links">
            <a href="{{ projeto.link_github }}" target="_blank" rel="noopener noreferrer" aria-label="Ver código do projeto {{ projeto.titulo }} no GitHub">
                <i class="fa-brands fa-github" aria-hidden="true"></i>
                código
            </a>
        </div>
    </div>
